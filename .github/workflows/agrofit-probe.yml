name: Agrofit probe (temporário)
on:
  push:
    branches: [ claude/empreendimentos-painel-visibilidade-anrppt ]
    paths: [ '.github/workflows/agrofit-probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Tentativas de acesso
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          CSV="dados.agricultura.gov.br/dataset/6c913699-e82e-4da3-a0a1-fb6c431e367f/resource/d30b30d7-e256-484e-9ab8-cd40974e1238/download/agrofitprodutosformulados.csv"
          try(){ echo "=== $1"; curl -sS -L --max-time 60 -A "$UA" -o out.bin -w "HTTP %{http_code} size %{size_download} type %{content_type}\n" "$1" || echo "curl falhou $?"; }
          try "https://$CSV"
          try "http://$CSV"
          try "https://dados.agricultura.gov.br/"
          try "https://dados.gov.br/api/publico/conjuntos-dados?nomeConjuntoDados=agrofit&pagina=1"
          try "https://dados.gov.br/dados/conjuntos-dados/sistema-de-agrotoxicos-fitossanitarios-agrofit"
          try "http://archive.org/wayback/available?url=$CSV"
          cat out.bin | head -c 600; echo
          try "https://web.archive.org/web/2026id_/https://$CSV"
          head -c 800 out.bin; echo; wc -c out.bin
          try "https://www.gov.br/agricultura/pt-br/assuntos/insumos-agropecuarios/insumos-agricolas/agrotoxicos/agrofit"
          try "https://agrofit.agricultura.gov.br/agrofit_cons/principal_agrofit_cons"
          try "https://www.agroapi.cnptia.embrapa.br/portal/assets/docs/agrofit.pdf"
          curl -sS --max-time 20 https://ipinfo.io/json || true
