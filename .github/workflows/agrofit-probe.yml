name: Agrofit probe (temporário)
on:
  push:
    branches: [ claude/empreendimentos-painel-visibilidade-anrppt ]
    paths: [ '.github/workflows/agrofit-probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar e resumir
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          CSV="https://dados.agricultura.gov.br/dataset/6c913699-e82e-4da3-a0a1-fb6c431e367f/resource/d30b30d7-e256-484e-9ab8-cd40974e1238/download/agrofitprodutosformulados.csv"
          curl -sS -L --max-time 900 -A "$UA" -o p.csv "$CSV" || curl -sS -L --max-time 900 -o p.csv "https://web.archive.org/web/2026id_/$CSV"
          ls -la p.csv
          python3 - <<'PY'
          import csv,collections,json,re
          raw=open('p.csv','rb').read()
          try: txt=raw.decode('utf-8-sig'); print('ENC utf8')
          except Exception: txt=raw.decode('latin-1'); print('ENC latin1')
          rows=list(csv.DictReader(txt.splitlines(), delimiter=';'))
          print('ROWS', len(rows))
          C=lambda k: collections.Counter((r.get(k) or '').strip() for r in rows)
          prods={}
          for r in rows:
            k=(r['NR_REGISTRO'] or '').strip(); p=prods.setdefault(k,{'m':(r['MARCA_COMERCIAL'] or '').strip(),'cult':set(),'pr':set(),'cl':set(),'ma':set()})
            p['cult'].add((r['CULTURA'] or '').strip()); p['pr'].add(((r['CULTURA'] or '').strip(),(r['PRAGA_NOME_COMUM'] or '').strip(),(r['PRAGA_NOME_CIENTIFICO'] or '').strip())); p['cl'].add((r['CLASSE'] or '').strip()); p['ma'].add((r['MODO_DE_ACAO'] or '').strip())
          print('PRODUTOS', len(prods))
          for k in ['CLASSE','SITUACAO','CLASSE_TOXICOLOGICA','CLASSE_AMBIENTAL','ORGANICOS','MODO_DE_ACAO']:
            c=C(k); print('DIST', k, len(c), c.most_common(25))
          print('FORMULACAO distintas', len(C('FORMULACAO')), C('FORMULACAO').most_common(8))
          print('CULTURAS distintas', len(C('CULTURA')), C('CULTURA').most_common(15))
          print('PRAGAS distintas', len(C('PRAGA_NOME_COMUM')), len(C('PRAGA_NOME_CIENTIFICO')))
          print('TITULARES', len(C('TITULAR_DE_REGISTRO')))
          multi=sum(1 for p in prods.values() if len(p['cl'])>1); print('produtos com mais de uma classe', multi)
          for cu in ['Soja','Milho','Feijão','Sorgo','Trigo','Algodão','Café']:
            n=sum(1 for p in prods.values() if any(x.lower().startswith(cu.lower()) for x in p['cult'])); print('CULT', cu, n)
          # tamanho estimado do JSON: base + culturas + pragas
          base={k:{'m':p['m'],'c':sorted(p['cult'])} for k,p in prods.items()}
          sbase=len(json.dumps(base,ensure_ascii=False))
          pr={k:sorted(p['pr']) for k,p in prods.items()}; spr=len(json.dumps(pr,ensure_ascii=False))
          print('JSON base+culturas (bytes)', sbase, '| pragas por produto/cultura (bytes)', spr, '| pares produto-cultura-praga', sum(len(p['pr']) for p in prods.values()))
          ex=[r for r in rows if 'glifosato' in (r['INGREDIENTE_ATIVO'] or '').lower()][:1]+[r for r in rows if (r['CLASSE'] or '').startswith('Adjuvante')][:1]+[r for r in rows if (r['CLASSE'] or '').startswith('Fertiliz')][:1]
          for r in ex: print('EX', {k:(v[:140] if v else v) for k,v in r.items() if k!='EMPRESA_PAIS_TIPO'})
          PY
