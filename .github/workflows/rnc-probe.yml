name: RNC probe (temporário)
on:
  push:
    branches: [claude/empreendimentos-painel-visibilidade-anrppt]
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true
      - run: python3 scripts/rnc_build.py app/agrofit --pdf 63288 63381
