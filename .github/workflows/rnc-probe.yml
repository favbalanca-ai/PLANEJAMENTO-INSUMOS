name: RNC probe (temporário)
on:
  push:
    branches: [ claude/empreendimentos-painel-visibilidade-anrppt ]
    paths: [ '.github/workflows/rnc-probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Procurar o Registro Nacional de Cultivares nos dados abertos
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for q in cultivares "registro nacional de cultivares" RNC CNCR sementes; do
            curl -sS -L --max-time 120 -A "$UA" "https://dados.agricultura.gov.br/api/3/action/package_search?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&rows=20" -o "s_$q.json" || true
          done
          python3 - <<'PY'
          import json,glob
          vistos=set()
          for f in glob.glob('s_*.json'):
            try: d=json.load(open(f))['result']
            except Exception as e: print('erro', f, e); continue
            for ds in d.get('results',[]):
              if ds['id'] in vistos: continue
              vistos.add(ds['id'])
              print('DATASET |', ds.get('title'), '|', ds.get('name'), '|', (ds.get('notes') or '')[:160].replace('\n',' '))
              for r in ds.get('resources',[]): print('   RES |', r.get('name'), '|', r.get('format'), '|', r.get('size'), '|', r.get('last_modified'), '|', r.get('url'))
          PY
      - name: Baixar e resumir os CSV de cultivares
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          python3 - <<'PY'
          import json,glob,re
          urls=[]
          for f in glob.glob('s_*.json'):
            try: d=json.load(open(f))['result']
            except Exception: continue
            for ds in d.get('results',[]):
              for r in ds.get('resources',[]):
                u=r.get('url') or ''
                if re.search(r'cultivar', (ds.get('title','')+ds.get('name','')+r.get('name','')+u), re.I) and re.search(r'csv|xlsx|json', (r.get('format') or '')+u, re.I) and u not in urls: urls.append(u)
          open('urls.txt','w').write('\n'.join(urls[:6])); print('URLS', urls[:6])
          PY
          i=0; while read -r u; do i=$((i+1)); echo "=== $u"; curl -sS -L --max-time 600 -A "$UA" -o "c_$i.bin" "$u" || echo "falhou"; ls -la "c_$i.bin" || true; done < urls.txt
          python3 - <<'PY'
          import csv,glob,collections,io
          for f in sorted(glob.glob('c_*.bin')):
            raw=open(f,'rb').read(); print('#####', f, len(raw), 'bytes')
            if raw[:2]==b'PK': print('xlsx/zip — pular'); continue
            txt=None
            for enc in ('utf-8-sig','latin-1'):
              try: txt=raw.decode(enc); print('ENC', enc); break
              except Exception: pass
            if not txt: continue
            lines=txt.splitlines(); head=lines[0]; print('HEADER:', head[:800])
            sep=';' if head.count(';')>=head.count(',') else ','
            rows=list(csv.DictReader(lines, delimiter=sep)); print('SEP', repr(sep), 'ROWS', len(rows))
            if not rows: continue
            for k in rows[0].keys():
              vals=[(r.get(k) or '').strip() for r in rows]; vals=[v for v in vals if v]; c=collections.Counter(vals)
              print('COL |', k, '| preenchidos', len(vals), '| distintos', len(c), '| ex', [v[:60] for v,_ in c.most_common(5)])
            for r in rows[:3]: print('ROW', {k:(v or '')[:80] for k,v in r.items()})
            soja=[r for r in rows if any('soja' in (v or '').lower() for v in r.values())]; print('linhas com soja', len(soja))
          PY
