name: RNC probe (temporário)
on:
  push:
    branches: [ claude/empreendimentos-painel-visibilidade-anrppt ]
    paths: [ '.github/workflows/rnc-probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: POST do formulário do CultivarWeb (lista completa e por espécie)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, http.cookiejar, re, html, collections, time
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          base='https://sistemas.agricultura.gov.br/snpc/cultivarweb/cultivares_registradas.php'
          def get(u, data=None):
            rq=urllib.request.Request(u, data=data, headers={'User-Agent':UA, 'Referer':base, **({'Content-Type':'application/x-www-form-urlencoded'} if data else {})})
            t0=time.time(); r=op.open(rq, timeout=900); b=r.read(); print('  ->', r.status, len(b), 'bytes', r.headers.get('Content-Type'), '%.1fs'%(time.time()-t0)); return b.decode('utf-8','ignore')
          h=get(base); tok=re.search(r'name="csrf_token" value="([0-9a-f]+)"', h).group(1); print('csrf', tok[:12])
          def tabela(t, nome):
            tabs=re.findall(r'<table[^>]*>(.*?)</table>', t, re.S|re.I); print(nome, 'tabelas', len(tabs))
            best=max(tabs, key=len) if tabs else ''
            rows=re.findall(r'<tr[^>]*>(.*?)</tr>', best, re.S|re.I); print(nome, 'linhas', len(rows))
            cab=[html.unescape(re.sub(r'<[^>]+>','',c)).strip() for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', rows[0], re.S|re.I)] if rows else []
            print(nome, 'CABEÇALHO', cab)
            for r in rows[1:5]: print(nome, 'ROW', [html.unescape(re.sub(r'<[^>]+>','',c)).strip()[:70] for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S|re.I)])
            if len(rows)>5:
              esp=collections.Counter(); links=0
              for r in rows[1:]:
                c=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S|re.I)]
                if c: esp[c[0][:40]]+=1
                if 'href' in r: links+=1
              print(nome, 'ESP top', esp.most_common(8), '| linhas com link', links)
              m=re.search(r'<tr[^>]*>(?:(?!</tr>).)*href(?:(?!</tr>).)*</tr>', best, re.S|re.I)
              if m: print(nome, 'EXEMPLO LINHA COM LINK', re.sub(r'\s+',' ', m.group(0))[:700])
            i=t.find('captcha'); print(nome, 'menciona captcha?', i>=0, '| texto:', re.sub(r'\s+',' ', re.sub(r'<[^>]+>',' ', t))[:300])
          campos={'csrf_token':tok,'postado':'1','cod_pagina':'1','validar':'1','cod_especie':'','txt_nome_comum':'','txt_denominacao':'','txt_requerente':'','txt_num_formulario':'','cod_evento_ogm':'','ct_captcha':'','acao':'Pesquisar'}
          print('=== lista completa (POST acao=pesquisar&postado=1)')
          t=get(base+'?acao=pesquisar&postado=1', urllib.parse.urlencode(campos).encode()); tabela(t,'TUDO')
          open('tudo.html','w').write(t)
          print('=== soja (cod_especie=2746)')
          c2=dict(campos); c2['cod_especie']='2746'
          t=get(base, urllib.parse.urlencode(c2).encode()); tabela(t,'SOJA')
          print('=== sem validar (validar=0) soja')
          c3=dict(c2); c3['validar']='0'; t=get(base, urllib.parse.urlencode(c3).encode()); tabela(t,'SOJA0')
          PY
          ls -la tudo.html
