name: RNC probe (temporário)
on:
  push:
    branches: [claude/empreendimentos-painel-visibilidade-anrppt]
permissions:
  contents: write
jobs:
  detalhes:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils >/dev/null 2>&1 || true
      - name: Detalhes (soja, milho e sorgo)
        timeout-minutes: 120
        continue-on-error: true
        run: RNC_DET_CAP=3000 python3 scripts/rnc_build.py app/agrofit --so-detalhes
      - name: Commit dos arquivos
        run: |
          git add app/agrofit/cultivares.json app/agrofit/rnc_det.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RNC: rnc_det.json — 2ª rodada de detalhes (soja, milho e sorgo; gerado pela ação)"
          git push
