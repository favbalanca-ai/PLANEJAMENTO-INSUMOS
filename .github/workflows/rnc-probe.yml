name: RNC probe (temporário)
on:
  push:
    branches: [ claude/empreendimentos-painel-visibilidade-anrppt ]
    paths: [ '.github/workflows/rnc-probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Link da lista completa do CultivarWeb
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -L --max-time 120 -A "$UA" -c jar.txt -o pg.html "https://sistemas.agricultura.gov.br/snpc/cultivarweb/cultivares_registradas.php"
          python3 - <<'PY'
          import re,html
          h=open('pg.html','rb').read().decode('utf-8','ignore')
          i=h.upper().find('LISTA COMPLETA'); print('CTX', html.unescape(h[max(0,i-900):i+300]).replace('\n',' ')[:1400])
          for m in re.findall(r'<a[^>]*>(?:(?!</a>).)*AQUI(?:(?!</a>).)*</a>', h, re.I|re.S): print('A', m[:400].replace('\n',' '))
          for m in re.findall(r'onclick="([^"]*)"', h, re.I)[:20]: print('ONCLICK', m[:200])
          for m in re.findall(r'<script[^>]*src="([^"]*)"', h, re.I): print('SCRIPT', m)
          for m in re.findall(r'function\s+\w+\s*\([^)]*\)\s*\{[^}]{0,300}\}', h)[:10]: print('FN', m[:300].replace('\n',' '))
          hrefs=sorted(set(re.findall(r'href="([^"]*)"', h, re.I))); print('HREFS', [x for x in hrefs if not x.endswith('.css')][:40])
          opts=re.findall(r'<option value="(\d+)">([^<]*Glycine max[^<]*|[^<]*Zea mays[^<]*|[^<]*Phaseolus vulgaris[^<]*|[^<]*Sorghum bicolor[^<]*)</option>', h)
          print('ESPECIES', opts[:10])
          PY
      - name: Tentar a lista completa
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          python3 - <<'PY'
          import re
          h=open('pg.html','rb').read().decode('utf-8','ignore')
          links=set()
          for m in re.findall(r'<a[^>]*>(?:(?!</a>).)*AQUI(?:(?!</a>).)*</a>', h, re.I|re.S):
            for u in re.findall(r'href="([^"]*)"', m): links.add(u)
            for u in re.findall(r"(?:location|open)\(['\"]([^'\"]+)", m): links.add(u)
          open('links.txt','w').write('\n'.join(links)); print('LINKS', links)
          PY
          while read -r u; do [ -z "$u" ] && continue; case "$u" in http*) full="$u";; /*) full="https://sistemas.agricultura.gov.br$u";; *) full="https://sistemas.agricultura.gov.br/snpc/cultivarweb/$u";; esac
            echo "=== $full"; curl -sS -L --max-time 900 -A "$UA" -b jar.txt -o lista.bin -w "HTTP %{http_code} size %{size_download} type %{content_type}\n" "$full" || echo "curl falhou"
            file lista.bin; head -c 1200 lista.bin | tr -d '\r' | tr -s ' \t' | head -c 1200; echo
            python3 - <<'PY'
          import re,html
          raw=open('lista.bin','rb').read()
          if raw[:2]==b'PK': print('ZIP/XLSX', len(raw)); import zipfile,io; z=zipfile.ZipFile(io.BytesIO(raw)); print(z.namelist()[:10])
          else:
            t=raw.decode('utf-8','ignore')
            rows=re.findall(r'<tr[^>]*>(.*?)</tr>', t, re.S|re.I); print('TR', len(rows))
            for r in rows[:6]: print('ROW', [html.unescape(re.sub(r'<[^>]+>','',c)).strip()[:60] for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S|re.I)])
            if len(rows)>6:
              import collections; esp=collections.Counter()
              for r in rows[1:]:
                c=[html.unescape(re.sub(r'<[^>]+>','',x)).strip() for x in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S|re.I)]
                if c: esp[c[0][:40]]+=1
              print('ESP top', esp.most_common(12)); print('linhas', len(rows)-1)
          PY
          done < links.txt
