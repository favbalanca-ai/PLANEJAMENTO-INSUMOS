name: Deploy app to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dois jobs de propósito: quando o envio do pacote (upload) e a publicação (deploy) ficam no MESMO job,
# o GitHub às vezes ainda não listou o artefato quando o deploy o procura ("No artifacts named github-pages
# were found" / "Found 0 artifact(s)" — actions/deploy-pages#451). Em jobs separados o artefato já existe.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
